[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "memcraft"
version = "0.1.0"
description = "Photo and idea to a short funny 9:16 video, fully local"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.16",
    "pillow>=13",
    "python-multipart>=0.0.34",
    "webauthn>=3.0.1",
    "httpx>=0.28",
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.28", "ruff>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a real Postgres in MEMCRAFT_TEST_DATABASE_URL",
    "compose: the director prompt with the background part (E16 background-first keyframes)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["e0-spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
