<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MemcraftAI</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/names.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>MemcraftAI</h1>
      <p id="status" role="status">Checking who you are…</p>
      <nav id="nav" hidden><a class="button primary-link" href="/new.html">Make a new video</a></nav>

      <section id="current-box" hidden>
        <h2>On the way</h2>
        <ul id="current" class="jobs"></ul>
      </section>

      <section id="videos-box" hidden>
        <h2>Your videos</h2>
        <ul id="videos" class="jobs"></ul>
      </section>

      <section id="earlier-box" hidden>
        <h2>Earlier</h2>
        <ul id="earlier" class="jobs"></ul>
      </section>

      <p id="empty" class="hint" hidden>No videos yet. Make your first one!</p>
    </main>
  </body>
</html>
