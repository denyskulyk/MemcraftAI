<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MemcraftAI</title>
  </head>
  <body>
    <h1>MemcraftAI</h1>
    <p id="health">Checking the app…</p>
    <script>
      fetch("/health")
        .then((r) => r.json())
        .then((h) => {
          document.getElementById("health").textContent =
            `App ${h.version}, database ${h.database}`;
        });
    </script>
  </body>
</html>
